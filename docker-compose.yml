networks:
  mackey:
    name: mackey

services:
  nginx:
    build: .docker/nginx
    container_name: mackey_nginx
    hostname: mackey_nginx
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
      - ./.docker/nginx/log:/var/log/nginx
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - mackey

  php:
    build: .docker/php
    container_name: mackey_php
    hostname: mackey_php
    restart: unless-stopped
    depends_on:
      - redis
      - db
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mackey

  redis:
    image: redis:alpine
    container_name: mackey_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    volumes:
      - ./.docker/redis/data:/data
    expose:
      - 6379
    networks:
      - mackey

  db:
    image: mysql:8.0
    container_name: mackey_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mackey
      MYSQL_USER: mackey
      MYSQL_PASSWORD: mackey@123
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./.docker/mysql/dbdata:/var/lib/mysql
    ports:
      - "3309:3306"
    networks:
      - mackey
